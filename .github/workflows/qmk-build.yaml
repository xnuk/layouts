# vim: sw=2
name: technik-mit-build

on:
  workflow_dispatch: {}
  push:
    branches: [ technik-mit ]

env:
  qmk_ref: 45ccd2e9351b979f8eb8fa359db732e5374b0d53
  qmk_cli_ref: 1.2.0

jobs:
  qmk-clone:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/cache@v4
      id: qmk-cache
      with:
        path: /tmp/qmk-${{ env.qmk_ref }}.tar.zst
        key: qmk-firmware-r2-${{ env.qmk_ref }}
        lookup-only: true
        enableCrossOsArchive: true

    - if: steps.qmk-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ env.qmk_ref }}
        repository: qmk/qmk_firmware
        submodules: recursive
        path: qmk_firmware

    - if: steps.qmk-cache.outputs.cache-hit != 'true'
      run: tar --exclude='./.git' --exclude='./keyboards' -C qmk_firmware -caf /tmp/qmk-${{ env.qmk_ref }}.tar.zst .

  docker-image-cache:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/cache@v4
      id: docker-cache
      with:
        path: /tmp/qmk_cli.tar.zst
        key: qmk-cli-r1-${{ env.qmk_cli_ref }}
        lookup-only: true

    - if: steps.docker-cache.outputs.cache-hit != 'true'
      run: >
        docker pull ghcr.io/qmk/qmk_cli:${{ env.qmk_cli_ref }} &&
        docker save -o /tmp/qmk_cli.tar ghcr.io/qmk/qmk_cli:${{ env.qmk_cli_ref }} &&
        zstd --rm /tmp/qmk_cli.tar

  build:
    needs: [ qmk-clone, docker-image-cache ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/cache@v4
      id: docker-cache
      with:
        path: /tmp/qmk_cli.tar.zst
        key: qmk-cli-r1-${{ env.qmk_cli_ref }}
        fail-on-cache-miss: true

    - run: >
        unzstd --stdout /tmp/qmk_cli.tar.zst | docker load &&
        rm /tmp/qmk_cli.tar.zst

    - uses: actions/cache/restore@v4
      with:
        path: /tmp/qmk-${{ env.qmk_ref }}.tar.zst
        key: qmk-firmware-r2-${{ env.qmk_ref }}
        fail-on-cache-miss: true
        enableCrossOsArchive: true

    - run: >
        tar xf /tmp/qmk-${{ env.qmk_ref }}.tar.zst &&
        rm /tmp/qmk-${{ env.qmk_ref }}.tar.zst

    - uses: actions/checkout@v4
      with:
        path: keyboards/technik_mit

    - run: docker pull ghcr.io/qmk/qmk_cli:${{ env.qmk_cli_ref }}
    - run: >
        docker run
        --mount type=bind,source="$(pwd)",target=/qmk-firmware
        ghcr.io/qmk/qmk_cli:${{ env.qmk_cli_ref }}
        sh -c 'cd qmk-firmware && find keyboards/ && SKIP_GIT=true make technik_mit:xnuk'


    - uses: actions/upload-artifact@v4
      with:
        name: bin
        path: '*.uf2'
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      with:
        name: buildfiles
        path: |
          .build/*
