kime_version: '^3.2.0'

daemon:
  modules:
  - Wayland
  - Indicator

indicator:
  icon_color: White

engine:
  default_category: Latin
  global_category_state: true
  global_hotkeys:
    Hangul:
      behavior: !Toggle [Hangul, Latin]
      result: Consume
    AltR:
      behavior: !Toggle [Hangul, Latin]
      result: Consume
    Esc:
      behavior: !Switch Latin
      result: Bypass
    S-Hangul:
      behavior: !Mode Emoji
      result: ConsumeIfProcessed

  mode_hotkeys:
    Emoji:
      Enter:
        behavior: Commit
        result: ConsumeIfProcessed

  latin:
    preferred_direct: true

  hangul:
    layout: xnuk
    word_commit: false
    addons:
      xnuk:
      - ComposeChoseongSsang
      - ComposeJongseongSsang
      - ComposeJungseongSsang
